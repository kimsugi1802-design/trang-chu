<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Template - Mai Phương</title>
    <style>
        /* Phong cách Wireframe: Đen trắng, tối giản, tập trung vào cấu trúc */
        body {
            font-family: monospace, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #000;
        }

        header, footer {
            border: 2px dashed #000;
            padding: 20px;
            text-align: center;
            background: #fff;
            margin: 10px;
        }

        .wireframe-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .box {
            border: 2px solid #000;
            padding: 30px;
            text-align: center;
            background: #fff;
            min-height: 100px;
        }

        /* Responsive cho Mobile */
        @media (max-width: 600px) {
            .wireframe-container {
                padding: 5px;
            }
            .box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>[HEADER / NAVIGATION BAR]</h2>
    </header>

    <div class="wireframe-container">
        <div class="box">
            <h1>[HERO SECTION / ẢNH BÌA & TIÊU ĐỀ]</h1>
            <p>Mô tả ngắn gọn về bản thân hoặc dự án.</p>
        </div>
        <div class="box">
            <h2>[SECTION 2: THÀNH TỰU / STATS]</h2>
            <p>Hiển thị các số liệu thống kê hoặc kỹ năng.</p>
        </div>
        <div class="box">
            <h2>[SECTION 3: FORM LIÊN HỆ / CONTACT]</h2>
            <p>[ Ô nhập tên ] [ Ô nhập email ] [ Nút gửi ]</p>
        </div>
    </div>

    <footer>
        <p>[FOOTER: Copyright &copy; 2026 Mai Phương]</p>
    </footer>

</body>
</html>
